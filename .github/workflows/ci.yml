name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventory-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: inventory-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Run unit tests
        run: npm run test:unit

  products-service-ci:
    name: Products Service CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: products-service/pom.xml

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-products-${{ hashFiles('products-service/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-products-
            ${{ runner.os }}-maven-

      - name: Run Spotless check
        run: ./mvnw spotless:check

      - name: Run Checkstyle
        run: ./mvnw checkstyle:check

      - name: Run tests
        run: ./mvnw clean test

  inventory-service-ci:
    name: Inventory Service CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventory-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: inventory-service/pom.xml

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-inventory-${{ hashFiles('inventory-service/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-inventory-
            ${{ runner.os }}-maven-

      - name: Run Spotless check
        run: ./mvnw spotless:check

      - name: Run Checkstyle
        run: ./mvnw checkstyle:check

      - name: Run tests
        run: ./mvnw clean test
