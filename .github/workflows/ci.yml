name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./inventory-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./inventory-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

  products-service-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./products-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: 'maven'

      - name: Run code formatting check with Spotless
        run: mvn spotless:check

      - name: Run Checkstyle analysis
        run: mvn checkstyle:check

      - name: Run tests
        run: mvn clean test

  inventory-service-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./inventory-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: 'maven'

      - name: Run code formatting check with Spotless
        run: mvn spotless:check

      - name: Run Checkstyle analysis
        run: mvn checkstyle:check

      - name: Run tests
        run: mvn clean test
